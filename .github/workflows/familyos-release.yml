name: FamilyOS Coordinated Release

# Build server images + versioned MAUI APK, deploy only after both are ready,
# then publish the APK release only after production health checks pass.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: familyos-release-main
  cancel-in-progress: false

jobs:
  validate-api:
    name: Build and test .NET solution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Expand EF migrations
        run: python3 scripts/expand-migrations.py
      - name: Restore .NET 8 API and domain tests
        run: |
          set -euo pipefail
          dotnet restore src/FamilyOS.Api/FamilyOS.Api.csproj
          dotnet restore tests/FamilyOS.Domain.Tests/FamilyOS.Domain.Tests.csproj

      - name: Build API and domain tests
        run: |
          set -euo pipefail
          dotnet build src/FamilyOS.Api/FamilyOS.Api.csproj -c Release --no-restore
          dotnet build tests/FamilyOS.Domain.Tests/FamilyOS.Domain.Tests.csproj -c Release --no-restore

      - name: Run domain tests
        run: dotnet test tests/FamilyOS.Domain.Tests/FamilyOS.Domain.Tests.csproj -c Release --no-build --verbosity minimal

  validate-maui:
    name: Run MAUI design-system tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test design tokens and controls contract
        run: dotnet test tests/FamilyOS.Maui.Tests/FamilyOS.Maui.Tests.csproj -c Release

  validate-mobile:
    name: Typecheck Expo mobile client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Expand or seed mobile brand assets
        run: |
          python3 scripts/expand-assets.py || true
          python3 scripts/seed-brand-assets.py || true
      - name: Install locked dependencies and typecheck
        working-directory: mobile
        run: |
          npm ci
          npx tsc --noEmit

  build-server-images:
    needs: [validate-api, validate-maui, validate-mobile]
    name: Build API + Keycloak images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props | head -1)
          test -n "$VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Package names must be lowercase for GHCR.
      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/familyos-api:latest
            ghcr.io/${{ github.repository_owner }}/familyos-api:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/familyos-api:${{ github.sha }}

      - name: Sync realm into docker build context
        run: |
          set -euo pipefail
          mkdir -p docker/keycloak
          if [ -f deploy/familyos/keycloak/realm-export.json ]; then
            cp deploy/familyos/keycloak/realm-export.json docker/keycloak/realm-export.json
          fi

      - name: Build and publish Keycloak image
        uses: docker/build-push-action@v6
        with:
          context: docker/keycloak
          file: docker/keycloak/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/familyos-keycloak:latest
            ghcr.io/${{ github.repository_owner }}/familyos-keycloak:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/familyos-keycloak:${{ github.sha }}

  build-android:
    needs: [validate-api, validate-maui, validate-mobile]
    name: Build versioned MAUI Android APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.value }}
      version_code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props | head -1)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Directory.Build.props VersionPrefix must be SemVer X.Y.Z; got '$VERSION'"
            exit 1
          fi
          CODE="$GITHUB_RUN_NUMBER"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building FamilyOS MAUI v$VERSION (Android versionCode $CODE)"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Stage MAUI brand assets
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow
          chmod +x scripts/stage-maui-brand-assets.sh
          ./scripts/stage-maui-brand-assets.sh

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --ignore-failed-sources

      - name: Restore MAUI Android project
        run: dotnet restore src/FamilyOS.Maui/FamilyOS.Maui.csproj -p:TargetFramework=net11.0-android

      - name: Publish versioned MAUI Release APK
        run: >
          dotnet publish src/FamilyOS.Maui/FamilyOS.Maui.csproj
          --configuration Release
          --framework net11.0-android
          -p:AndroidPackageFormat=apk
          -p:ApplicationDisplayVersion=${{ steps.version.outputs.value }}
          -p:ApplicationVersion=${{ steps.version.outputs.code }}
          -p:Version=${{ steps.version.outputs.value }}
          -p:InformationalVersion=${{ steps.version.outputs.value }}+${GITHUB_SHA::7}

      - name: Stage versioned APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find src/FamilyOS.Maui/bin/Release/net11.0-android -type f -name '*Signed.apk' -print -quit)
          if [[ -z "$APK" ]]; then
            APK=$(find src/FamilyOS.Maui/bin/Release/net11.0-android -type f -name '*.apk' -print -quit)
          fi
          if [[ -z "$APK" ]]; then
            echo "::error::MAUI build did not produce an APK."
            find src/FamilyOS.Maui/bin/Release/net11.0-android -maxdepth 6 -type f -print || true
            exit 1
          fi
          mkdir -p artifacts
          OUT="artifacts/FamilyOS-MAUI-Android-v${{ steps.version.outputs.value }}-build${{ steps.version.outputs.code }}.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          (cd artifacts && sha256sum "$(basename "$OUT")" > SHA256SUMS.txt)
          cat artifacts/SHA256SUMS.txt
          ls -lh "$OUT"

      - name: Upload versioned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyOS-MAUI-Android-v${{ steps.version.outputs.value }}-build${{ steps.version.outputs.code }}
          path: |
            ${{ steps.apk.outputs.path }}
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  # Deploy only when both the server images and installable client have built.
  deploy-server:
    name: Deploy and verify AWS server
    needs: [build-server-images, build-android]
    if: github.ref == 'refs/heads/main' && needs.build-server-images.result == 'success' && needs.build-android.result == 'success'
    uses: ./.github/workflows/deploy-stack.yml
    secrets: inherit

  # Do not publish a client release when the production deployment or health checks fail.
  publish-coordinated-release:
    name: Publish release with installable MAUI APK
    needs: [build-android, deploy-server]
    if: github.ref == 'refs/heads/main' && needs.build-android.result == 'success' && needs.deploy-server.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FamilyOS-MAUI-Android-v${{ needs.build-android.outputs.version }}-build${{ needs.build-android.outputs.version_code }}
          path: release-assets

      - name: Publish coordinated GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-android.outputs.version }}
          VERSION_CODE: ${{ needs.build-android.outputs.version_code }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          APK=$(find release-assets -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          SUMS=$(find release-assets -maxdepth 1 -type f -name 'SHA256SUMS.txt' -print -quit || true)
          TAG="v${VERSION}-build${BUILD_NUMBER}"
          ARGS=("$APK")
          if [[ -n "${SUMS:-}" ]]; then ARGS+=("$SUMS"); fi
          # Replace an existing tag only when retrying this exact run's release.
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "${GITHUB_REPOSITORY}" --yes || true
            git push origin ":refs/tags/${TAG}" || true
          fi
          gh release create "$TAG" "${ARGS[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "FamilyOS v${VERSION} (build ${BUILD_NUMBER})" \
            --notes "FamilyOS MAUI Android release.

- **versionName:** ${VERSION}
- **versionCode:** ${VERSION_CODE}
- **Commit:** ${GITHUB_SHA}

Install the attached APK. This release is published only after API and Keycloak deployment health checks pass." \
            --latest

      - name: Release summary
        run: |
          {
            echo "## FamilyOS coordinated release"
            echo "- App version: ${{ needs.build-android.outputs.version }}"
            echo "- Android versionCode: ${{ needs.build-android.outputs.version_code }}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- APK release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${{ needs.build-android.outputs.version }}-build${{ github.run_number }}"
          } >> "$GITHUB_STEP_SUMMARY"
