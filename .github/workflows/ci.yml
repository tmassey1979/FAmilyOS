name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOMAIN_COVERAGE_ENFORCE: "false"
  DOMAIN_COVERAGE_MIN: "70"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Expand EF migrations
        run: python3 scripts/expand-migrations.py

      - name: Compute version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if TAG=$(git describe --tags --abbrev=0 2>/dev/null); then
            RAW_VERSION="${TAG#v}"
          else
            RAW_VERSION=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props || echo "0.1.0")
          fi

          if [[ "$RAW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            VERSION="$RAW_VERSION"
          elif [[ "$RAW_VERSION" =~ ([0-9]+\.[0-9]+\.[0-9]+)[-.]?build[-.]?([0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}-build.${BASH_REMATCH[2]}"
          else
            echo "::error::Cannot normalize '$RAW_VERSION' to a valid NuGet semantic version."
            exit 1
          fi

          SHORT=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "info=$RAW_VERSION+$SHORT" >> "$GITHUB_OUTPUT"
          echo "Using NuGet version $VERSION (informational version $RAW_VERSION+$SHORT)"

      - name: Restore backend + domain tests
        run: |
          set -euo pipefail
          for proj in \
            src/FamilyOS.Contracts/FamilyOS.Contracts.csproj \
            src/FamilyOS.Domain/FamilyOS.Domain.csproj \
            src/FamilyOS.Application/FamilyOS.Application.csproj \
            src/FamilyOS.Infrastructure/FamilyOS.Infrastructure.csproj \
            src/FamilyOS.Api/FamilyOS.Api.csproj \
            tests/FamilyOS.Domain.Tests/FamilyOS.Domain.Tests.csproj
          do
            dotnet restore "$proj"
          done

      - name: Build backend + domain tests
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          INFO="${{ steps.ver.outputs.info }}"
          for proj in \
            src/FamilyOS.Contracts/FamilyOS.Contracts.csproj \
            src/FamilyOS.Domain/FamilyOS.Domain.csproj \
            src/FamilyOS.Application/FamilyOS.Application.csproj \
            src/FamilyOS.Infrastructure/FamilyOS.Infrastructure.csproj \
            src/FamilyOS.Api/FamilyOS.Api.csproj \
            tests/FamilyOS.Domain.Tests/FamilyOS.Domain.Tests.csproj
          do
            dotnet build "$proj" --configuration Release --no-restore \
              -p:Version="$VER" -p:InformationalVersion="$INFO"
          done

      - name: Test Domain
        run: >
          dotnet test tests/FamilyOS.Domain.Tests/FamilyOS.Domain.Tests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory coverage
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Domain coverage gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          COV=$(find coverage -name 'coverage.cobertura.xml' | head -1 || true)
          if [[ -z "${COV}" ]]; then
            echo "::warning::No cobertura file found"
            echo "Domain line coverage: n/a" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET, pathlib, sys
          paths = list(pathlib.Path('coverage').rglob('coverage.cobertura.xml'))
          if not paths:
              print('No cobertura'); sys.exit(0)
          root = ET.parse(paths[0]).getroot()
          rates = []
          for pkg in root.findall('.//package'):
              name = pkg.get('name') or ''
              if 'FamilyOS.Domain' in name or name.endswith('Domain'):
                  lr = pkg.get('line-rate')
                  if lr:
                      rates.append(float(lr))
          if not rates:
              lr = root.get('line-rate')
              rates = [float(lr)] if lr else [0.0]
          pct = max(rates) * 100.0
          min_pct = float(os.environ.get('DOMAIN_COVERAGE_MIN', '70'))
          enforce = os.environ.get('DOMAIN_COVERAGE_ENFORCE', 'false').lower() in ('1', 'true', 'yes')
          print(f'Domain line coverage: {pct:.1f}% (min {min_pct:.0f}%, enforce={enforce})')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f'\n### Domain coverage\n- **{pct:.1f}%** line (target ≥ {min_pct:.0f}%, enforce={enforce})\n')
          if pct + 1e-6 < min_pct:
              msg = f'Domain coverage {pct:.1f}% below {min_pct:.0f}%'
              if enforce:
                  print(f'::error::{msg}')
                  sys.exit(1)
              print(f'::warning::{msg} (report-only; set DOMAIN_COVERAGE_ENFORCE=true to fail)')
          PY

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domain-coverage
          path: coverage
          retention-days: 14

  maui-design-system:
    name: MAUI design-system tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test design tokens & controls contract
        run: >
          dotnet test tests/FamilyOS.Maui.Tests/FamilyOS.Maui.Tests.csproj
          --configuration Release

  mobile-typecheck:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Expand brand assets
        run: python3 scripts/expand-assets.py || true
      - name: Seed brand fallback
        run: python3 scripts/seed-brand-assets.py || true
      - name: Install & typecheck
        working-directory: mobile
        run: |
          npm install
          npx tsc --noEmit

  maui-android-apk:
    name: Build MAUI Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Stage MAUI brand assets
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow
          chmod +x scripts/stage-maui-brand-assets.sh
          ./scripts/stage-maui-brand-assets.sh

      - name: Resolve MAUI app version
        id: maui-version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props | head -1)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Directory.Build.props VersionPrefix must be SemVer X.Y.Z; got '$VERSION'"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --ignore-failed-sources

      - name: Restore MAUI Android project
        run: dotnet restore src/FamilyOS.Maui/FamilyOS.Maui.csproj -p:TargetFramework=net11.0-android

      - name: Build installable debug APK
        run: >
          dotnet publish src/FamilyOS.Maui/FamilyOS.Maui.csproj
          --configuration Debug
          --framework net11.0-android
          -p:AndroidPackageFormat=apk
          -p:ApplicationDisplayVersion=0.1.0
          -p:ApplicationVersion=${{ github.run_number }}

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find src/FamilyOS.Maui/bin/Debug/net11.0-android -type f -name '*Signed.apk' -print -quit)
          if [[ -z "$APK" ]]; then
            APK=$(find src/FamilyOS.Maui/bin/Debug/net11.0-android -type f -name '*.apk' -print -quit)
          fi
          if [[ -z "$APK" ]]; then
            echo "::error::MAUI Android build completed without producing an APK."
            find src/FamilyOS.Maui/bin/Debug/net11.0-android -maxdepth 5 -type f -print || true
            exit 1
          fi
          mkdir -p artifacts
          cp "$APK" artifacts/FamilyOS-android-debug.apk
          ls -lh artifacts/FamilyOS-android-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyOS-Android-Debug-APK
          path: artifacts/FamilyOS-MAUI-Android-v${{ steps.maui-version.outputs.value }}-build${{ steps.maui-version.outputs.code }}-debug.apk
          if-no-files-found: error
          retention-days: 14
