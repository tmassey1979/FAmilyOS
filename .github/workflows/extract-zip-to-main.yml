name: Extract zip to main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch with zip
        uses: actions/checkout@v4
        with:
          ref: tmassey1979-patch-1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract FamilyOS-main.zip to workspace
        run: |
          set -euo pipefail
          ls -la FamilyOS-main.zip
          unzip -o FamilyOS-main.zip -d /tmp
          # Zip root is FamilyOS-main/
          ls /tmp/FamilyOS-main | head -20

          # Clean current tree (keep .git)
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +

          # Copy extracted contents to repo root
          cp -a /tmp/FamilyOS-main/. .

          # Remove the zip itself so it does not stay on main
          rm -f FamilyOS-main.zip

          # Show result
          ls -la | head -30
          find . -type f ! -path './.git/*' | wc -l

      - name: Commit and push to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git status --short | head -40

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "chore: restore full source from FamilyOS-main.zip (via Actions)"

          # Force-push the extracted tree onto main
          git push origin HEAD:main --force
