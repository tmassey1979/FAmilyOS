name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump when not triggered by a tag"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      eas_platforms:
        description: "EAS platforms to build"
        required: true
        default: all
        type: choice
        options: [all, android, ios]
      build_aab:
        description: "Also build the Android App Bundle (uses an additional Expo build)"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release-api:
    name: API release (tag + GHCR)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Expand EF migrations
        run: python3 scripts/expand-migrations.py

      - name: Compute version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAG="${GITHUB_REF#refs/tags/}"
          else
            BASE=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props || echo "0.1.0")
            # bump based on input
            IFS=. read -r MA MI PA <<< "$BASE"
            case "${{ inputs.bump }}" in
              major) MA=$((MA+1)); MI=0; PA=0 ;;
              minor) MI=$((MI+1)); PA=0 ;;
              *) PA=$((PA+1)) ;;
            esac
            VERSION="${MA}.${MI}.${PA}"
            TAG="v${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG ($VERSION)"

      - name: Restore & build
        run: |
          dotnet restore FamilyOS.sln
          dotnet build FamilyOS.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: |
          dotnet test tests/FamilyOS.Domain.Tests/FamilyOS.Domain.Tests.csproj -c Release --no-build --verbosity minimal

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/familyos-api:latest
            ghcr.io/${{ github.repository_owner }}/familyos-api:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/familyos-api:${{ github.sha }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Create GitHub Release (tag if needed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG" || true
          fi
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes --target "${GITHUB_SHA}"

  mobile-typecheck:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Expand brand assets
        run: |
          python3 scripts/expand-assets.py || true
          python3 scripts/seed-brand-assets.py || true
      - name: Install & typecheck
        working-directory: mobile
        run: |
          npm install
          npx tsc --noEmit

  eas-build:
    name: EAS production build
    needs: [release-api, mobile-typecheck]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Expand EAS brand bundle
        id: expand_eas_brand
        continue-on-error: true
        working-directory: .
        run: |
          if [[ -f scripts/expand-eas-brand-bundle.py ]]; then
            python3 scripts/expand-eas-brand-bundle.py
          else
            echo "No expand-eas-brand-bundle.py — skip"
            exit 1
          fi

      - name: Expand brand assets (brand-source b64)
        working-directory: .
        id: expand_brand
        continue-on-error: true
        run: python3 scripts/expand-assets.py || true

      - name: Seed brand fallback
        if: steps.expand_eas_brand.outcome != 'success' && steps.expand_brand.outcome != 'success'
        run: python3 scripts/seed-brand-assets.py || true

      - name: Install mobile deps
        working-directory: mobile
        run: |
          if [[ -f package-lock.json ]]; then npm ci; else npm install; fi

      - name: Check EAS readiness
        id: eas_ready
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::EXPO_TOKEN not set — skipping EAS build"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: EAS whoami
        if: steps.eas_ready.outputs.ready == 'true'
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest whoami

      - name: EAS build Android APK
        if: steps.eas_ready.outputs.ready == 'true' && (github.event.inputs.eas_platforms == 'all' || github.event.inputs.eas_platforms == 'android' || github.event_name == 'push')
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest build --platform android --profile production-apk --non-interactive --wait || \
            echo "::warning::EAS APK build failed or queued"

      - name: EAS build Android AAB
        if: steps.eas_ready.outputs.ready == 'true' && github.event.inputs.build_aab == 'true'
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest build --platform android --profile production --non-interactive --wait || \
            echo "::warning::EAS AAB build failed or queued"

      - name: EAS build iOS
        if: steps.eas_ready.outputs.ready == 'true' && (github.event.inputs.eas_platforms == 'all' || github.event.inputs.eas_platforms == 'ios')
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest build --platform ios --profile production --non-interactive --wait || \
            echo "::warning::EAS iOS build failed or queued"

      - name: Summary
        if: always()
        run: |
          echo "## EAS build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${{ needs.release-api.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`${{ needs.release-api.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ready: \`${{ steps.eas_ready.outputs.ready }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Builds: https://expo.dev/accounts/tmassey1979/projects/familyos/builds" >> "$GITHUB_STEP_SUMMARY"

  deploy-stack:
    name: Redeploy (Portainer)
    needs: [release-api]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy-stack.yml
    secrets: inherit
